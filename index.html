<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ONESAZ by Acadhub brings academics, administration, exams, communication, payments and student learning together on one AI-powered platform for schools, colleges and institutes." />
    <link rel="icon" type="image/png" href="/images/onesaz-mark.png" />
    <title>ONESAZ by Acadhub — AI-Powered Education Management</title>
    <meta name="theme-color" content="#2447D1" />
    <!-- Link previews (WhatsApp, LinkedIn, Facebook, X). Title/description are updated per page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ONESAZ by Acadhub" />
    <meta property="og:title" content="ONESAZ by Acadhub — AI-Powered Education Management" />
    <meta property="og:description" content="ONESAZ by Acadhub brings academics, administration, exams, communication, payments and student learning together on one AI-powered platform for schools, colleges and institutes." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ONESAZ by Acadhub — AI-Powered Education Management" />
    <meta name="twitter:description" content="ONESAZ by Acadhub brings academics, administration, exams, communication, payments and student learning together on one AI-powered platform for schools, colleges and institutes." />
    <!-- Landing page fonts (loaded early so text doesn't reflow) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms: static copy of the "Book a demo" form so Netlify registers its fields at deploy time. -->
    <form name="book-a-demo" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="institution" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="institution-type"><option>School</option></select>
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
