<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ONESAZ by Acadhub brings academics, administration, exams, communication, payments and student learning together on one AI-powered platform for schools, colleges and institutes." />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <title>ONESAZ by Acadhub — AI-Powered Education Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms: static copy of the "Book a demo" form so Netlify registers its fields at deploy time. -->
    <form name="book-a-demo" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="institution" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="institution-type"><option>School</option></select>
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
